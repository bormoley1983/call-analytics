[mypy]
python_version = 3.12
strict = False
mypy_path = src:tests
namespace_packages = True
explicit_package_bases = True
check_untyped_defs = True

[mypy-faster_whisper.*]
ignore_missing_imports = True

[mypy-tqdm.*]
ignore_missing_imports = True

[mypy-requests.*]
ignore_missing_imports = True

[mypy-qdrant_client.*]
ignore_missing_imports = True

[mypy-paramiko.*]
ignore_missing_imports = True
